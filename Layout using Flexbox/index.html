<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Software services</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./TTLakes/stylesheet.css" />
    <link rel="stylesheet" href="/Normalize-min-css/normalize_min.css" />
  </head>

  <body>
    <header class="header">
      <div class="header__menu">
        <ul class="header__list">
          <li class="list__item-menu">
            <a href="#">
              <img src="./ic/burger.svg" alt="menu-icon" />
            </a>
          </li>
          <li class="list__item-logo">
            <a href="#">
              <img src="./ic/logo.svg" alt="logo-icon" />
            </a>
            <div class="devider"></div>
          </li>
          <li class="list__item-repair">
            <a href="#">
              <img src="./ic/repair.svg" alt="repair-icon" />
            </a>
          </li>
          <li class="list__item-checkstatus">
            <a href="#">
              <img src="./ic/checkstatus.svg" alt="checkstatus-icon" />
            </a>
          </li>
        </ul>
      </div>
    </header>

    <main class="main">
      <div class="title">
        <div class="title__text">
          <h1>Услуги и сервисы</h1>
        </div>
      </div>
      <div class="services">
        <nav class="services__menu">
          <ul class="services__list">
            <li class="services__item services__item--active">
              Ремонтируемые устройства
            </li>
            <li class="services__item">Дополнительные услуги</li>
            <li class="services__item">Цены на услуги</li>
            <li class="services__item">Специальные предложения</li>
            <li class="services__item">Ремонтируемые бренды</li>
            <li class="services__item">Отзывы клиентов</li>
          </ul>
        </nav>
      </div>
    </main>
  </body>
</html>
