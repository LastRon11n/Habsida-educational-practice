<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Grid — Простой макет</title>
<style>
  body { margin: 0; font-family: Arial, sans-serif; }
  .layout {
    display: grid;
    grid-template-areas:
      "header header"
      "sidebar main"
      "footer footer";
    grid-template-columns: 220px 1fr;
    grid-template-rows: 70px 1fr 50px;
    gap: 10px;
    height: 100vh;
    padding: 10px;
    box-sizing: border-box;
  }
  header { grid-area: header; background:#334155; color:white; display:flex; align-items:center; justify-content:center; }
  aside  { grid-area: sidebar; background:#e2e8f0; padding:15px; }
  main   { grid-area: main; background:#f8fafc; padding:15px; overflow:auto; }
  footer { grid-area: footer; background:#0f172a; color:white; display:flex; align-items:center; justify-content:center; }
  /* Адаптив: на узких экранах колонки в одну колонку */
  @media (max-width: 700px) {
    .layout {
      grid-template-areas:
        "header"
        "main"
        "sidebar"
        "footer";
      grid-template-columns: 1fr;
      grid-template-rows: auto 1fr auto auto;
    }
  }
</style>
</head>
<body>
  <div class="layout">
    <header>Header</header>
    <aside>Sidebar — меню / фильтры</aside>
    <main>Main content — сюда ставь статьи, карточки, и т.д.</main>
    <footer>Footer</footer>
  </div>
</body>
</html>
