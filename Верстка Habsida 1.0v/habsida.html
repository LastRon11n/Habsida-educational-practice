<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>iintoo Registration</title>
    <link rel="stylesheet" href="./habsida-style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="container">
      <section class="left_side">
        <div class="banner">
          <img
            src="./picture/banner.jpg"
            alt="main_banner"
            class="banner_img"
          />
        </div>

        <div class="logo">
          <img src="./picture/logo.svg" alt="in-logo_img" class="in-logo_img" />
        </div>
      </section>

      <section class="right_side">
        <div class="title">
          <p class="title_mane">Get iintoo it today</p>
          <p>There is no change or obligation upon registration</p>
        </div>

        <div class="social_btn">
          <button class="fb_btn">
            <img
              src="./picture/facebook.svg"
              alt="facebook-logo"
              class="fb_img"
            />
            <span class="fb_text">Register with Facebook</span>
          </button>

          <button class="in_btn">
            <img src="./picture/linkedin.svg" alt="" class="in_img" />
            <span class="in_text">Register with Linkedin</span>
          </button>
        </div>
        <div class="divider">
          <span>OR</span>
        </div>

        <div class="form_group">
          <input type="email" class="input_box" placeholder="Email" />
          <input type="tel" class="input_box" placeholder="Phone" />
        </div>

        <div class="type_text">
          <h2>What type of investor are you?</h2>
          <p>Select the type of investor you are below.</p>
        </div>

        <!-- Радиокнопки -->

        <div class="radio_group">
          <div class="label_group">
            <label class="select_label">
              <input class="real_radio" type="radio" name="category" checked />
              <span class="custom_radio"></span> Individual
              <span class="info_icon"> &#x24D8; </span>
              <div class="tooltip_text">
                I am a natural person investing on my own behalf as a sole
                owner, joint tenant, or tenant in common
              </div>
            </label>
          </div>

          <div class="label_group">
            <label class="select_label">
              <input class="real_radio" type="radio" name="category" />
              <span class="custom_radio"></span> Business
              <span class="info_icon"> &#x24D8; </span>
            </label>
          </div>

          <div class="label_group">
            <label class="select_label">
              <input class="real_radio" type="radio" name="category" />
              <span class="custom_radio"></span> IRA
              <span class="info_icon"> &#x24D8; </span>
            </label>
          </div>

          <div class="label_group">
            <label class="select_label">
              <input class="real_radio" type="radio" name="category" />
              <span class="custom_radio"></span> Trust
              <span class="info_icon"> &#x24D8; </span>
            </label>
          </div>
        </div>
        <div class="checkbox-group">
          <input type="checkbox" />
          <span>
            I agree to the terms and receiving notifications from intoo</span
          >
          <a href="#">View full terms</a>
        </div>
        <div class="create_account_group">
          <button class="create_account_btn">Create Account</button>
        </div>
      </section>
    </main>
  </body>
</html>
